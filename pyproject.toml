[project]
name = "time-series-analytics"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "influxdb-client>=1.44",
  "pandas>=2.2",
  "numpy>=2.0",
  "requests>=2.32",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
 "httpx>=0.27",
 "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
